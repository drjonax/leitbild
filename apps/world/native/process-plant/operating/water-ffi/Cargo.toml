[package]
name = "leitbild-operating-water"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Opt-in narrow maintained IF97 C ABI, not another property backend"

[features]
ida = []
# Stock IDAS of the same SUNDIALS release: IDA plus quadratures.
quadratures = ["ida"]

[workspace]

[dependencies]
leitbild-operating-plant = { path = ".." }

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints.clippy]
all = "warn"
