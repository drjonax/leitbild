[package]
name = "leitbild-operating-water"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Opt-in narrow maintained IF97 C ABI, not another property backend"

[features]
ida = []
# Stock IDAS of the same SUNDIALS release: IDA plus quadratures.
quadratures = ["ida"]

[workspace]

[dependencies]
leitbild-operating-plant = { path = ".." }
# The steady solids preparation binary's one JSON boundary.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# G18/S2-D3: the steady solid state by stock IDA (needs the `ida` feature).
[[bin]]
name = "prepare_steady_solids"
required-features = ["ida"]

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints.clippy]
all = "warn"
